name: Paquets

# Fabrique les trois versions et publie les versions Windows et macOS comme artefacts.
# Le paquet hébergement est seulement vérifié : il contient un code d'installation personnel,
# à fabriquer en local (npm run package:hosting) pour ne pas le rendre public.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:php
      - run: npm run package:hosting
      - run: npm run package:desktop
      - run: npm run test:node
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPosting-Windows
          path: dist/VideoPosting-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPosting-macOS
          path: dist/VideoPosting-macOS.zip
